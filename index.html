<!DOCTYPE html>
<html>
  <head>
    <title>Doctor WebAR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      <a-assets>
        <a-asset-item id="doctorModel" src="assets/doctor.glb"></a-asset-item>
      </a-assets>

      <a-image src="assets/image.png" position="0 0 0" width="2" height="2" visible="false"></a-image>

      <a-marker-camera preset='hiro'></a-marker-camera>

      <a-entity position="0 0 0">
        <a-entity gltf-model="#doctorModel" scale="0.5 0.5 0.5" position="0 0 0"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
